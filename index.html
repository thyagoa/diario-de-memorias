<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário de Memórias">
<title>Diário de Memórias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Lora:ital,wght@0,400;1,400&family=Nunito:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de celular centralizada; no computador, a mesma coluna sobre um fundo rosado com flores nos cantos. Visual único, claro, floral. */
:root{
  --t:1.2; --th:1.1; --min:14px;
  --bg:#ffffff; --blush:#fff7f9; --blush2:#fff4f7; --line:#f5dde4; --line2:#f0b3c3;
  --ink:#4a2636; --muted:#7a5563; --accent:#b23a60; --accent-ink:#8f2c4c; --rose:#9a3456; --eyebrow:#b8506f;
  --leaf-bg:#e9efe3; --leaf-ink:#465e3c; --done:#86a473;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --k:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#fbeef2;color:var(--ink);font:calc(16px*var(--t))/1.5 var(--f-body)}
.stage{min-height:100%;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:520px;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(154,52,86,.12)}}
.deco{position:absolute;pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:max(var(--min),calc(12px*var(--t)));font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--eyebrow)}
.serif{font-family:var(--f-display)}
.it{font-style:italic}
.muted{color:var(--muted)}
.btn{min-height:52px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:calc(16px*var(--t));display:flex;align-items:center;justify-content:center;gap:8px;padding:0 22px;width:100%}
.btn:hover{background:var(--accent-ink)}
.btn:disabled{background:#f6dfe6;color:#8a6672;cursor:default}
.btn.soft{background:var(--blush);color:var(--ink);border:1.5px solid var(--line2)}
.btn.soft:hover{background:#ffeef3}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:calc(14px*var(--t));padding:10px 4px;min-height:44px}
.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:0;background:none;color:var(--ink);flex-shrink:0}
.icon:hover{background:var(--blush)}
.sizer{display:flex;gap:4px}
.sizer button{width:44px;height:44px;border:1.5px solid var(--line2);border-radius:999px;background:var(--blush);font-weight:600}
.sizer button:disabled{opacity:.4;cursor:default}
.bar{height:6px;border-radius:3px;background:#fbe6ec;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.chip{font-size:max(var(--min),calc(11px*var(--t)));font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.L{background:var(--leaf-bg);color:var(--leaf-ink)}
.chip.M{background:#fde7ee;color:var(--rose)}
.chip.P{background:#f3dbe3;color:#7a2d45}

/* capa */
.cover{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:clamp(140px,22vh,190px) 30px 120px}
.cover h1{margin:0;font:italic 400 calc(42px*var(--th))/1.06 var(--f-display);text-wrap:balance}
.cover .who{display:flex;flex-direction:column;gap:4px;min-height:70px;justify-content:center}
.cover .name{font:400 calc(30px*var(--th))/1.15 var(--f-display);color:var(--accent);overflow-wrap:anywhere}
.cover form{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.cover label{font-weight:700;font-size:calc(14px*var(--t))}
.cover input{height:54px;width:100%;padding:0 20px;border:1.5px solid var(--line2);border-radius:999px;background:var(--blush);font-size:calc(18px*var(--t));font-weight:500}
::placeholder{color:#7d5d69;opacity:1}

/* cabeçalhos */
.top{position:relative;padding:22px 16px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}   /* com letra grande, o contador e o A-/A+ descem para a linha de baixo em vez de esmagar o título */
.toprow .t{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:1px}
.toprow .t span:first-child{text-shadow:0 0 5px #fff,0 0 5px #fff,0 0 8px #fff;font-size:max(var(--min),calc(11px*var(--t)));font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow)}
.toprow .t span:last-child{font:italic 400 calc(20px*var(--t))/1.15 var(--f-display)}
.scroll{flex:1;overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px;position:relative}

/* índice */
.ihead{position:relative;padding:28px 20px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.ihead h1{margin:0;font:italic 400 calc(31px*var(--th))/1.1 var(--f-display);padding-right:84px}
.cont{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:22px;padding:14px 18px;background:var(--accent);color:#fff;width:100%}
.cont:hover{background:var(--accent-ink)}
.cont small{font-size:max(var(--min),calc(12px*var(--t)));opacity:.9;display:block}
.cont b{font-size:calc(16px*var(--t));font-weight:600;line-height:1.3;display:block}
.chlist{list-style:none;margin:0;padding:0}
.chrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;padding:12px 8px;border:0;border-bottom:1px solid #f8e6ec;background:none;text-align:left;min-height:56px}
.chrow:hover{background:var(--blush2)}
.chrow .n{font:italic 400 calc(24px*var(--t))/1 var(--f-display);color:#d1708d}
.chrow.on .n{color:#d9587e}
.chrow .tt{font-size:calc(15px*var(--t));font-weight:600;line-height:1.25}
.chrow .mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.chrow .bar{height:5px}
.chrow .bar>i.full{background:var(--done)}
.chrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.chrow .cnt{font-size:max(var(--min),calc(12px*var(--t)));color:var(--muted);font-variant-numeric:tabular-nums}
.st-done{background:var(--leaf-bg);color:var(--leaf-ink)}
.st-go{background:#fde7ee;color:var(--accent)}
.st-new{color:var(--muted);font-weight:500}
.paths-tags{display:flex;gap:4px;flex-wrap:wrap}
.paths-tags span{font-size:max(var(--min),calc(11px*var(--t)));font-weight:700;padding:2px 8px;border-radius:999px;background:#fde7ee;color:var(--rose)}
.paths-tags span.off{background:none;color:var(--muted);text-decoration:line-through;font-weight:500}
.foot{padding:18px 8px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.confirm{margin:0 8px;padding:14px;border-radius:16px;background:var(--blush2);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:calc(14px*var(--t))}
.confirm .row{display:flex;gap:8px}
.confirm .row .btn{min-height:44px;font-size:calc(14px*var(--t))}

/* pergunta */
.parent{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:18px;background:var(--blush2);border:1px solid #f8dbe3}
.parent .lbl{font-size:max(var(--min),calc(12px*var(--t)));font-weight:700;color:var(--rose)}
.parent .q{font-size:calc(14px*var(--k));font-weight:600;line-height:1.35}
.parent .a{font:italic 400 calc(14px*var(--k))/1.45 var(--f-display);color:#6a3a4c}
.qmeta{display:flex;align-items:center;gap:10px;font-size:max(var(--min),calc(12px*var(--t)));font-weight:600;color:var(--muted)}
.qtext{margin:0;font:400 calc(26px*var(--k))/1.25 var(--f-display);text-wrap:pretty}
.ans{display:flex;flex-direction:column;gap:6px}
.ans label{font-size:max(var(--min),calc(13px*var(--t)));font-weight:700;color:var(--muted)}
textarea{min-height:190px;resize:vertical;width:100%;padding:16px;border:1.5px solid var(--line2);border-radius:20px;background:var(--blush);font-size:calc(16px*var(--k));line-height:1.55}
.ansrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.photo{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px dashed #eba0b4;border-radius:999px;background:transparent;font-weight:600;font-size:max(var(--min),calc(13px*var(--t)));cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:flex;flex-direction:column;gap:14px}
.pitem{display:flex;gap:12px;align-items:flex-start}
.capl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.capl span{font-size:max(var(--min),calc(12px*var(--t)));font-weight:700;color:var(--muted)}
.capin{height:48px;width:100%;padding:0 16px;border:1.5px solid var(--line2);border-radius:999px;background:var(--blush);font-size:calc(15px*var(--k))}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.thumbs button::before{content:"×";width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;font-size:calc(16px*var(--t));line-height:28px;text-align:center}
.note{font-size:max(var(--min),calc(12px*var(--t)));color:var(--muted)}
.next{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px dashed #f5cdd8}
.next span:last-child{font-size:calc(14px*var(--k));line-height:1.4;color:var(--muted)}
.actions{padding:12px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,2fr);gap:8px;background:var(--bg)}
.actions button{height:48px;border-radius:999px;font-weight:700;font-size:calc(15px*var(--t))}
.actions .ghost{border:1.5px solid var(--line2);background:var(--blush);display:flex;align-items:center;justify-content:center}
.actions .go{border:0;background:var(--accent);color:#fff}
.actions .go:hover{background:var(--accent-ink)}

/* escolha */
.pcard{display:flex;flex-direction:column;gap:12px;width:100%;padding:16px;border-radius:22px;border:2px solid var(--line);background:#fff;text-align:left}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--blush2)}
.pcard .r{display:flex;align-items:flex-start;gap:12px}
.pcard .k{flex-shrink:0;width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fde7ee;color:var(--rose)}
.pcard[aria-pressed="true"] .k{background:var(--accent);color:#fff}
.pcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcard .tx b{font:400 calc(19px*var(--k))/1.2 var(--f-display)}
.pcard .tx span{font-size:calc(14px*var(--k));line-height:1.45;color:var(--muted)}
.pcard .ck{flex-shrink:0;width:26px;height:26px;border-radius:999px;border:2px solid #eba0b4;display:flex;align-items:center;justify-content:center;background:#fff}
.pcard[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.pcard .ex{display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px dashed #f5cdd8}
.pcard .ex i{font:italic 400 calc(14px*var(--k))/1.4 var(--f-display);color:#6a3a4c}
.pcard .ex b{font-size:max(var(--min),calc(12px*var(--t)));color:var(--rose)}
.lead{margin:0;font-size:calc(15px*var(--k));line-height:1.5;color:var(--muted)}
.h1q{margin:0;font:400 calc(26px*var(--k))/1.25 var(--f-display)}
.botbar{padding:12px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* fim de capítulo */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:120px 28px 120px;position:relative}
.done h1{margin:0;font:italic 400 calc(34px*var(--th))/1.1 var(--f-display);text-wrap:balance}
.done .stats{display:flex;gap:28px;margin:6px 0}
.done .stats b{display:block;font:400 calc(30px*var(--th))/1 var(--f-display);color:var(--accent)}
.done .stats span{font-size:max(var(--min),calc(13px*var(--t)));color:var(--muted)}
.done .btns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:calc(14px*var(--t));z-index:20}
/* conforto de leitura (Ajustes): botões maiores e contraste reforçado; tamanhos de letra pelas variáveis --t/--th */
:root[data-hit="1"] button,:root[data-hit="1"] select,:root[data-hit="1"] label.photo,:root[data-hit="1"] input:not([type=file]),:root[data-hit="1"] textarea{min-height:56px}
:root[data-hit="1"] .icon,:root[data-hit="1"] .sizer button{width:56px;height:56px}
:root[data-hit="1"] .tabbar button{min-height:68px}
:root[data-hit="1"] .chrow{min-height:72px}
:root[data-hit="1"] .confirm .row .btn{min-height:56px}
:root[data-hit="1"] .actions{grid-template-columns:56px minmax(0,1fr) minmax(0,2fr)}
:root[data-hc="1"]{--muted:#4d2d3b;--eyebrow:#8f2c4c;--line:#e3b0c0;--line2:#c0607e;--rose:#7a2d45;--leaf-ink:#2d4724;--accent:#a52f56}
:root[data-hc="1"] ::placeholder{color:#5f3f4c}
:root[data-hc="1"] .chrow .n{color:var(--accent)}
:root[data-hc="1"] input,:root[data-hc="1"] textarea,:root[data-hc="1"] .pcard,:root[data-hc="1"] .sizer button,:root[data-hc="1"] .btn.soft,:root[data-hc="1"] .seg button,:root[data-hc="1"] .tog{border-width:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.tog{min-height:44px;border-radius:999px;border:1.5px solid var(--line2);background:var(--blush);color:var(--ink);font-weight:700;padding:0 16px;font-size:max(var(--min),calc(14px*var(--t)))}
.seg button[aria-pressed="true"],.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.setl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.setl>b{font-size:max(var(--min),calc(14px*var(--t)))}
.sample{margin:0;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);line-height:1.45;width:100%}
/* prévia do livro: páginas A5 (559×794) escaladas para caber na tela */
.icon:disabled{opacity:.35;cursor:default}
.pitem figure{flex-shrink:0}
.bk-stage{align-items:center;background:#fbeef2}
.bk-win{position:relative;overflow:hidden;background:#fff;box-shadow:0 6px 24px rgba(154,52,86,.22);flex-shrink:0}
.bk-sc{width:559px;height:794px;transform-origin:0 0}
.bk-wait{display:flex;align-items:center;justify-content:center;background:#fff;color:var(--muted);font-weight:600;box-shadow:0 6px 24px rgba(154,52,86,.12)}
.bk-nav{display:flex;align-items:center;gap:8px;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.bk-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:max(var(--min),calc(13px*var(--t)));font-weight:700;color:var(--muted);text-align:center}
.bk-mid select{max-width:100%;height:40px;border:1.5px solid var(--line2);border-radius:999px;background:var(--blush);padding:0 14px;font-size:calc(14px*var(--t));font-weight:600;color:var(--ink)}
.bk-measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none}
.bk-page{width:559px;height:794px;box-sizing:border-box;background:#fff;color:#3a1f2b;font-family:Lora,Georgia,serif;position:relative;overflow:hidden;padding:56px 64px 64px;display:flex;flex-direction:column;text-align:left}
.bk-page.cover{padding:0;font-family:Nunito,system-ui,sans-serif}
.bk-head{display:flex;justify-content:space-between;align-items:center;font:700 12px/1.4 Nunito,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#b8506f;padding-bottom:10px;border-bottom:1px solid #f5cdd8}
.bk-head.rev{flex-direction:row-reverse}
.bk-c{flex:1;min-height:0;overflow:hidden;padding-top:28px}
.bk-c>*+*{margin-top:22px}
.bk-c>.bk-q+*{margin-top:10px}
.bk-c>.bk-a+.bk-a{margin-top:8px}
.bk-q{margin:0;font:italic 400 22px/1.25 Fraunces,Georgia,serif;color:#b23a60;text-wrap:balance}
.bk-a{margin:0;font-size:16px;line-height:1.65;text-wrap:pretty}
.bk-sepw{display:flex;justify-content:center;height:12px}
.bk-fig{margin:0}
.bk-fig .ph{height:290px;border-radius:6px;background:#fdeef2;border:1px solid #f5cdd8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bk-fig img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.bk-fig figcaption{margin-top:8px;font-style:italic;font-size:13px;line-height:1.4;color:#6a3a4c;text-align:center}
.bk-num{font:600 12px/1.4 Nunito,system-ui,sans-serif;color:#7a5563;text-align:center;font-variant-numeric:tabular-nums;padding-top:6px}
.bk-cover{position:absolute;left:70px;right:70px;top:234px;height:370px;box-sizing:border-box;padding:24px 14px;background:#fff6f8;border:1.5px solid #f0b3c4;border-radius:30px;box-shadow:0 0 0 6px #fff,0 0 0 7.5px #f7ccd8,inset 0 0 0 7px #fff6f8,inset 0 0 0 8px #f8d0db;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.bk-cover .k1{font-size:14px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#b8506f}
.bk-cover h1{margin:0;font:italic 400 54px/1.04 Fraunces,Georgia,serif;color:#3a1f2b}
.bk-cover .who{display:flex;flex-direction:column;gap:6px}
.bk-cover .who span:first-child{font-size:18px;color:#6a3a4c}
.bk-cover .nm{font:400 40px/1.1 Fraunces,Georgia,serif;color:#b23a60;overflow-wrap:anywhere}
.bk-capt{position:absolute;left:72px;right:72px;top:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.bk-capt .e{font-size:13px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#b8506f}
.bk-capt .n{font:400 96px/.9 Fraunces,Georgia,serif;color:#f29bb3}
.bk-capt h1{margin:6px 0 0;font:italic 400 52px/1.05 Fraunces,Georgia,serif;color:#3a1f2b;text-wrap:balance}
.bk-capt p{margin:0;max-width:340px;font:italic 400 17px/1.55 Fraunces,Georgia,serif;color:#6a3a4c;text-wrap:balance}
/* barra inferior do índice (fixa, sempre à vista) */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(154,52,86,.08);padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{position:relative;min-height:58px;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:max(var(--min),calc(12px*var(--t)));font-weight:700;color:var(--muted)}
.tabbar button:hover{background:var(--blush)}
.tabbar button.on{color:var(--accent)}
.tabbar .lbl{display:flex;align-items:center;gap:6px}
.tabbar .dot{width:8px;height:8px;border-radius:50%;background:var(--done)}
.tabbar .dot.off{background:#d9a441}.tabbar .dot.err{background:#d92d4f}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
/* sincronização */
.syncline{display:flex;align-items:center;gap:8px;align-self:flex-start;border:0;background:none;padding:6px 0;min-height:32px;font-size:max(var(--min),calc(12px*var(--t)));color:var(--muted);text-align:left}
.syncline i{width:8px;height:8px;border-radius:50%;background:var(--done);flex-shrink:0}
.syncline.err{color:var(--accent-ink);font-weight:600}.syncline.err i{background:var(--accent)}
.sform{display:flex;flex-direction:column;gap:12px}
.sform label{font-weight:700;font-size:calc(14px*var(--t))}
.sform input{height:54px;width:100%;padding:0 20px;border:1.5px solid var(--line2);border-radius:999px;background:var(--blush);font-size:calc(16px*var(--t));font-weight:500}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

// ---------- sincronização via GitHub (repositório privado de dados) ----------
// Mesmo desenho do KaraTube: respostas.json + fotos/<pergunta>-<id>.<ext>. Mescla por registro, vence o maior carimbo (u).
// Resposta apagada vira texto vazio com carimbo novo; foto removida vira del:true (o arquivo fica no repositório).
const SYNC={busy:false,timer:null,applying:false,lastTry:0};
const ghOn=()=>!!(S.gh&&S.gh.token&&S.gh.repo);
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});

async function gh(path,o){
  o=o||{};const g=S.gh;
  const r=await fetch("https://api.github.com/repos/"+g.repo+path,{method:o.method||"GET",cache:"no-store",
    headers:Object.assign({Authorization:"Bearer "+g.token,Accept:o.accept||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},o.body?{"Content-Type":"application/json"}:{}),
    body:o.body?JSON.stringify(o.body):undefined});
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e;}
  return o.bin?r.blob():o.text?r.text():(r.status===204?null:r.json());
}
function ghErrMsg(e){
  if(!e)return "Erro desconhecido.";
  if(e.timeout)return "A internet está lenta demais agora. Tento de novo depois.";
  if(e.status===401)return "Token inválido ou expirado. Gere outro no GitHub.";
  if(e.status===403)return "O GitHub recusou (limite de uso ou token sem permissão).";
  if(e.status===404)return "Repositório não encontrado, ou o token não tem acesso a ele.";
  if(e.message==="Failed to fetch"||e.name==="TypeError")return "Sem conexão com o GitHub.";
  return "Falha na sincronização: "+(e.message||"erro");
}
async function ghTree(){
  const g=S.gh;
  if(!g.branch){const info=await gh("");g.branch=info.default_branch||"main";}
  try{const t=await gh("/git/trees/"+encodeURIComponent(g.branch)+"?recursive=1");
    const m={};(t.tree||[]).forEach(x=>{if(x.type==="blob")m[x.path]=x.sha;});return m;
  }catch(e){if(e.status===404||e.status===409)return {};throw e;} // repositório vazio
}
const ghText=sha=>gh("/git/blobs/"+sha,{accept:"application/vnd.github.raw+json",text:true});
const ghFile=sha=>gh("/git/blobs/"+sha,{accept:"application/vnd.github.raw+json",bin:true});
const ghPutB64=(path,content,sha,msg)=>gh("/contents/"+path.split("/").map(encodeURIComponent).join("/"),{method:"PUT",body:{message:msg,content,sha:sha||undefined}} /* sem "branch": usa a padrão, e funciona também no 1º envio de um repositório vazio */);
const picPath=(id,p)=>"fotos/"+p.q+"-"+id+"."+p.ext;

function serialize(){
  const paths={};Object.keys(S.pu).forEach(k=>{const p=S.paths[k]||{};paths[k]={A:!!p.A,B:!!p.B,chosen:!!S.chosen[k],u:S.pu[k]};});
  const answers={};Object.keys(S.au).forEach(k=>{answers[k]={t:S.answers[k]||"",u:S.au[k]};});
  return JSON.stringify({app:"diario-de-memorias",v:2,at:Date.now(),name:S.name?{v:S.name,u:S.nameAt}:undefined,paths,answers,pics:S.pics});
}
function mergeRemote(rem){
  const st={local:0,remote:0};
  const rn=rem.name;
  if(rn&&rn.v&&(rn.u||0)>(S.nameAt||0)){S.name=rn.v;S.nameAt=rn.u;st.local++;}
  else if(S.name&&(S.nameAt||0)>((rn||{}).u||0))st.remote++;
  const rp=rem.v>=2?(rem.paths||{}):legacyKeys(rem.paths); // v1 guardava os caminhos pela posição do capítulo
  new Set([...Object.keys(S.pu),...Object.keys(rp)]).forEach(k=>{
    const l=S.pu[k]||0,x=rp[k]||{},r=x.u||0;
    if(r>l){S.paths[k]={A:!!x.A,B:!!x.B};S.chosen[k]=!!x.chosen;S.pu[k]=r;st.local++;}
    else if(l>r)st.remote++;
  });
  const ra=rem.answers||{};
  new Set([...Object.keys(S.au),...Object.keys(ra)]).forEach(id=>{
    const l=S.au[id]||0,x=ra[id]||{},r=x.u||0;
    if(r>l){S.answers[id]=x.t||"";S.au[id]=r;st.local++;}
    else if(l>r)st.remote++;
  });
  const rf=rem.pics||{};
  new Set([...Object.keys(S.pics),...Object.keys(rf)]).forEach(id=>{
    const l=S.pics[id],x=rf[id];
    if(x&&(!l||(x.u||0)>(l.u||0))){S.pics[id]={q:x.q,ext:x.ext,cap:x.cap||"",u:x.u||0,del:!!x.del};st.local++;}
    else if(l&&(!x||(l.u||0)>(x.u||0)))st.remote++;
  });
  return st;
}
const nAns=a=>Object.values(a||{}).filter(x=>((x&&x.t!==undefined?x.t:x)||"").trim()).length;

// Atualiza a tela depois de sincronizar, sem atrapalhar quem está digitando.
function syncRefresh(changed){
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||""))return;
  if(view==="pergunta"){
    if(!seq(cur.ch)[cur.i]){go("indice");return;}
    if(changed)render(true);
    return;
  }
  render(true);
}
// Fotos grandes na internet móvel: respostas sobem primeiro (texto é leve e é o que mais importa); as fotos vêm depois,
// uma de cada vez, com progresso. Falha numa foto não derruba a sincronização do texto; o que faltar sobe na próxima.
const MAX_FOTO=40*1024*1024; // acima disso o GitHub (API de conteúdo) fica instável: avisa e não envia
const onMobileData=()=>{const c=navigator.connection;return !!c&&(c.type==="cellular"||(c.type===undefined&&c.saveData===true));};
const photosBlocked=()=>(S.photoNet|0)===0&&onMobileData();
const picsPendingUp=()=>Object.entries(S.pics).filter(([id,p])=>!p.del&&!(S.gh&&S.gh.sent&&S.gh.sent[id])).length;
function progText(short){const p=SYNC.prog;if(!p)return "";return short?`Foto ${p.i}/${p.n}`:`${p.dir==="up"?"Enviando":"Baixando"} foto ${p.i} de ${p.n}${p.pct!=null?" · "+p.pct+"%":""}`;}
let _pp=0;
function setProg(o){SYNC.prog=o;const t=Date.now();if(!o||t-_pp>250){_pp=t;paintProg();}}
function paintProg(){document.querySelectorAll("[data-prog]").forEach(el=>{el.textContent=el.dataset.prog==="short"?(progText(true)||"Sync"):syncStatus();});}
function ghPutPhoto(path,content,msg,onProg){ // XMLHttpRequest só para ter o progresso do envio
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open("PUT","https://api.github.com/repos/"+S.gh.repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/"));
    x.setRequestHeader("Authorization","Bearer "+S.gh.token);x.setRequestHeader("Accept","application/vnd.github+json");
    x.setRequestHeader("X-GitHub-Api-Version","2022-11-28");x.setRequestHeader("Content-Type","application/json");
    x.timeout=240000;
    x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded/e.total);};
    x.onload=()=>x.status>=200&&x.status<300?res():rej(Object.assign(new Error("HTTP "+x.status),{status:x.status}));
    x.onerror=()=>rej(new TypeError("Failed to fetch"));
    x.ontimeout=()=>rej(Object.assign(new Error("timeout"),{timeout:true}));
    x.send(JSON.stringify({message:msg,content}));
  });
}
async function ghPhotos(tree,blocked){
  const g=S.gh, r={up:0,down:0,pendUp:0,pendDown:0,falhas:0,grandes:0,rede:false};
  const lista=Object.entries(S.pics).filter(([,p])=>!p.del);
  lista.forEach(([id,p])=>{if(tree[picPath(id,p)])g.sent[id]=1;});   // já está no repositório
  const baixar=[],subir=[];
  for(const [id,p] of lista){
    const path=picPath(id,p),tem=await idbHas(id);
    if(tree[path]&&!tem)baixar.push([id,path]);
    else if(!tree[path]&&tem&&!g.sent[id])subir.push([id,p,path]);
    else if(!tree[path]&&!tem)g.sent[id]=1;   // sem arquivo aqui e sem arquivo lá (ex.: foto grande que o outro aparelho não enviou): não é pendência deste aparelho
  }
  r.pendDown=baixar.length;r.pendUp=subir.length;
  if(blocked)return r;
  let k=0;
  for(const [id,path] of baixar){
    setProg({dir:"down",i:++k,n:baixar.length});
    try{await idbPut(id,await ghFile(tree[path]));r.down++;r.pendDown--;}
    catch(e){if(e.status===401||e.status===403)throw e;r.falhas++;if(e.name==="TypeError"){r.rede=true;break;}}
  }
  k=0;
  for(const [id,p,path] of subir){
    k++;const b=await idbGet(id);
    if(!b){r.pendUp--;continue;}
    if(b.size>MAX_FOTO){r.grandes++;r.pendUp--;g.sent[id]=1;continue;}
    setProg({dir:"up",i:k,n:subir.length,pct:0});
    try{
      await ghPutPhoto(path,await b64(b),"Foto "+p.q,f=>setProg({dir:"up",i:k,n:subir.length,pct:Math.round(f*100)}));
      g.sent[id]=1;r.up++;r.pendUp--;
    }catch(e){
      if(e.status===422){g.sent[id]=1;r.pendUp--;continue;}                  // já existia
      if(e.status===401||e.status===403)throw e;
      r.falhas++;r.rede=true;break;                                           // internet fraca: para e tenta depois
    }
  }
  setProg(null);
  return r;
}
async function ghSyncNow(manual,opts){
  opts=opts||{};

  SYNC.busy=true;SYNC.lastTry=Date.now();SYNC.prog=null;syncMsg="Sincronizando…";syncRefresh(false);
  const g=S.gh;g.sent=g.sent||{};let summary="",changed=0,retry=false;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const tree=await ghTree();
      let rem={};const sha=tree["respostas.json"];
      if(sha)rem=JSON.parse(await ghText(sha));
      if(!g.last&&nAns(S.answers)&&nAns(rem.answers)&&!confirm("Este aparelho já tem "+nAns(S.answers)+" respostas e o GitHub já tem "+nAns(rem.answers)+". Juntar os dois?"))

            if(!r.placed){
              if(ai===0&&!cont){undo();close();open();cur.c.appendChild(h);r=bkPlace(cur,a,false,over,true);}  // título sem conteúdo no fim da página: vai junto para a próxima
              else{close();open();r=bkPlace(cur,a,cont,over,true);}
            }
            if(r.rest){close();open();a={t:r.rest};cont=true;continue;}
            break;
          }
        }
        added.length=0;
      }
      close();
    }
    return pages;
  }finally{host.remove();}
}
async function bkEnsure(){
  const sig=bkSig();if(BK.pages&&BK.sig===sig&&!BK.busy)return;
  BK.busy=true;BK.sig=sig;if(view==="livro")render(true);
  await new Promise(r=>setTimeout(r,40));
  try{BK.pages=await bkBuild();}catch(e){console.error(e);BK.pages=[{k:"capa"}];toast("Não consegui montar todas as páginas.",4000);}
  BK.busy=false;if(BK.i>=BK.pages.length)BK.i=0;if(view==="livro")render(true);
}
function bkPageHtml(pg){
  if(pg.k==="capa")return `<div class="bk-page cover">${BK_CAPA_SVG}<div class="bk-cover"><div class="k1">Diário de Memórias</div><h1>Mãe, qual é<br>a sua história?</h1>${divider.replace('width="120" height="16"','width="150" height="20"')}<div class="who"><span>O livro com histórias de</span><span class="nm">${esc(S.name||"[Nome]")}</span></div></div></div>`;
  if(pg.k==="cap"){const c=DATA[pg.ci];return `<div class="bk-page cover">${BK_CAP_SVG}<div class="bk-capt"><div class="e">Capítulo</div><div class="n">${pad(c.num)}</div><h1>${esc(c.t)}</h1>${divider}<p>${esc(c.d)}</p></div></div>`;}
  return `<div class="bk-page"><div class="bk-head ${pg.num%2?"":"rev"}"><span>${esc(pg.head)}</span>${BK_FLOWER}</div><div class="bk-c">${pg.html}</div><div class="bk-num">${pg.num}</div></div>`;
}
function bkGo(i){const n=BK.pages?BK.pages.length:0;if(!n)return;BK.i=Math.max(0,Math.min(n-1,i));render(true);}
function vLivro(){
  const pgs=BK.pages,w=Math.max(200,Math.min(BOOK_W,app.clientWidth-32)),s=w/BOOK_W,total=pgs?pgs.length:0,i=Math.min(BK.i,Math.max(0,total-1));
  const wait=!pgs||BK.busy;
  const jump=pgs?pgs.map((p,k)=>p.k==="cap"?`<option value="${k}">Capítulo ${pad(DATA[p.ci].num)} · ${esc(DATA[p.ci].t)}</option>`:"").join(""):"";
  const cur=pgs&&pgs[i];
  return `${topFlowers}<div class="top"><div class="toprow">
      <button class="icon" data-a="indice" aria-label="Voltar ao índice" style="margin-left:-10px">${chev("l")}</button>
      <div class="t"><span>Prévia</span><span>O livro${S.name?" de "+esc(S.name):""}</span></div></div></div>
  <div class="scroll bk-stage" id="bkStage">
    ${wait?`<div class="bk-wait" style="width:${w}px;height:${Math.round(BOOK_H*s)}px">Montando o livro…</div>`
      :`<div class="bk-win" style="width:${w}px;height:${Math.round(BOOK_H*s)}px"><div class="bk-sc" style="transform:scale(${s})">${bkPageHtml(cur)}</div></div>`}
    ${!wait&&total===1?`<p class="lead" style="text-align:center">O livro vai aparecendo aqui conforme você responde as perguntas.</p>`:""}
    ${!wait?`<p class="note" style="text-align:center">É uma prévia: o livro final é montado a partir das suas respostas e fotos.</p>`:""}
  </div>
  <div class="bk-nav">
    <button class="icon" data-a="bkprev" ${wait||i<=0?"disabled":""} aria-label="Página anterior">${chev("l")}</button>
    <div class="bk-mid"><span>${wait?"":(cur.k==="capa"?"Capa":cur.k==="cap"?"Abertura do capítulo":"Página "+cur.num)+" · "+(i+1)+" de "+total}</span>
      ${!wait&&total>2?`<select id="bkjump" aria-label="Ir para o capítulo"><option value="">Ir para…</option><option value="0">Capa</option>${jump}</select>`:""}</div>
    <button class="icon" data-a="bknext" ${wait||i>=total-1?"disabled":""} aria-label="Próxima página">${chev("r")}</button>
  </div>`;
}
window.addEventListener("keydown",e=>{if(view!=="livro")return;if(e.key==="ArrowRight")bkGo(BK.i+1);if(e.key==="ArrowLeft")bkGo(BK.i-1);});
let _bkR;window.addEventListener("resize",()=>{if(view!=="livro")return;clearTimeout(_bkR);_bkR=setTimeout(()=>render(true),150);});

// ---------- render e ações ----------
const app=document.getElementById("app");
function render(focus){
  app.innerHTML = ({capa:vCapa,indice:vIndice,escolha:vEscolha,pergunta:vPergunta,fim:vFim,sync:vSync,livro:vLivro,convite:vConvite})[view]();
  if(view==="pergunta"){
    const ta=document.getElementById("resposta"), it=seq(cur.ch)[cur.i];
    let tm; ta.addEventListener("input",()=>{setAns(it.id,ta.value);clearTimeout(tm);
      tm=setTimeout(()=>{save();document.getElementById("saved").textContent=ta.value.trim()?"Guardado com carinho":"";},400);});
    document.getElementById("foto").addEventListener("change",async e=>{
      const fs=[...e.target.files]; e.target.value=""; if(!fs.length) return;
      setAns(it.id,ta.value);
      try{for(const f of fs){
        const id=uid(), ext=((f.name.match(/\.(\w{2,5})$/)||[])[1]||(f.type.split("/")[1]||"jpg")).toLowerCase().replace("jpeg","jpg");
        await idbPut(id,f); S.pics[id]={q:it.id,ext,cap:"",u:Date.now()};}
      }catch(err){toast("Não consegui guardar a foto neste aparelho.",4000);}
      save(); render(true);});
  }
  if(view==="livro"){
    const st=document.getElementById("bkStage"); let x0=null;
    st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
    st.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)bkGo(BK.i+(dx<0?1:-1));});
    const j=document.getElementById("bkjump"); if(j) j.addEventListener("change",()=>{if(j.value!=="")bkGo(+j.value);});
  }
  if(view==="sync"){
    const f=document.getElementById("syncForm");
    if(f) f.addEventListener("submit",e=>{e.preventDefault();
      const repo=document.getElementById("ghrepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,""), token=document.getElementById("ghtok").value.trim();
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast("Escreva o repositório assim: usuario/nome-do-repositorio");return;}
      if(!token){toast("Cole o token do GitHub.");return;}
      S.gh={repo,token,branch:"",last:0,err:""};save();syncMsg="";render(true);ghSyncNow(true);});
  }
  hydrate();
  if(view==="capa"){
    const inp=document.getElementById("nome");
    if(inp) inp.addEventListener("input",()=>{document.getElementById("shownName").textContent=inp.value.trim()||"[Seu nome]";});
    document.getElementById("capaForm").addEventListener("submit",e=>{e.preventDefault();
      if(inp){const v=inp.value.trim(); if(!v){inp.focus();inp.setAttribute("aria-invalid","true");toast("Escreva seu nome para abrir o livro.");return;} S.name=v;S.nameAt=Date.now();save();}
      go("indice");});
  }
  const sc=app.querySelector(".scroll"); if(sc && !focus) sc.scrollTop=0;
}
function go(v){view=v;confirmReset=false;render();window.scrollTo(0,0);if(v==="sync")storCheck();}
function openCh(ci){
  cur.ch=ci;
  if(needsChoice(ci)){sel=Object.assign({A:false,B:false},S.paths[DATA[ci].id]||{});go("escolha");return;}
  const s=seq(ci); const i=s.findIndex(x=>!answered(x.id));
  cur.i=i<0?0:i; S.last={ch:ci,i:cur.i}; save(); go("pergunta");
}
function step(d){
  const s=seq(cur.ch); const ta=document.getElementById("resposta");
  if(ta){setAns(s[cur.i].id,ta.value);}
  const ni=cur.i+d;
  if(ni<0){save();go("indice");return;}
  if(ni>=s.length){doneCh=cur.ch;S.last=null;save();go("fim");return;}
  cur.i=ni;S.last={ch:cur.ch,i:ni};save();render();
}
let tt;function toast(m,ms){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ms||2400);}

let capT; // legenda da foto: grava na hora na memória e no aparelho 0,5 s depois de parar de digitar
app.addEventListener("input",e=>{
  const c=e.target.closest("[data-cap]"); if(!c) return;
  const p=S.pics[c.dataset.cap]; if(!p) return;
  p.cap=c.value; p.u=Date.now(); clearTimeout(capT); capT=setTimeout(save,500);
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="fs-"||a==="fs+"){
    const ta=document.getElementById("resposta"); if(ta) setAns(seq(cur.ch)[cur.i].id,ta.value);
    S.fs=Math.max(0,Math.min(SCALES.length-1,S.fs+(a==="fs+"?1:-1)));applyFs();save();render(true);return;}
  if(a==="indice") { const ta=document.getElementById("resposta"); if(ta){setAns(seq(cur.ch)[cur.i].id,ta.value);save();} go("indice"); }
  if(a==="sync"){const ta=document.getElementById("resposta"); if(ta){setAns(seq(cur.ch)[cur.i].id,ta.value);save();} go("sync");}
  if(a==="syncnow") ghSyncNow(true);
  if(a==="syncbtn"){ if(ghOn()) ghSyncNow(true); else go("sync"); }
  if(a==="invok"&&invite){S.gh={repo:invite.repo,token:invite.token,branch:"",last:0,err:""};invite=null;save();syncMsg="";go(S.name?"indice":"capa");ghSyncNow(true);}
  if(a==="invno"){invite=null;go(S.name?"indice":"capa");}
  if(a==="set-ui"){S.ui=+b.dataset.v;applyLook();save();render(true);}
  if(a==="set-hit"){S.hit=S.hit?0:1;applyLook();save();render(true);}
  if(a==="set-hc"){S.hc=S.hc?0:1;applyLook();save();render(true);}
  if(a==="set-reset"){S.ui=1;S.hit=0;S.hc=0;S.fs=2;applyLook();save();render(true);}
  if(a==="set-net"){S.photoNet=+b.dataset.v;save();render(true);if(S.photoNet===1&&ghOn())syncSoon(1500);}
  if(a==="photosnow") ghSyncNow(true,{photosNow:true});
  if(a==="stor") storAsk();
  if(a==="install") installApp();
  if(a==="book"){go("livro");bkEnsure();}
  if(a==="bkprev") bkGo(BK.i-1);
  if(a==="bknext") bkGo(BK.i+1);
  if(a==="chkupd") checkUpdate(false);
  if(a==="doupd") applyUpdate();
  if(a==="syncoff"){ if(confirm("Desligar a sincronização neste aparelho? As respostas e fotos continuam aqui e no GitHub.")){S.gh=null;syncMsg="";save();render(true);} }
  if(a==="capa") go("capa");
  if(a==="rename"){S.name="";save();render();}
  if(a==="open") openCh(+b.dataset.ch);
  if(a==="resume"){cur={ch:+b.dataset.ch,i:+b.dataset.i};go("pergunta");}
  if(a==="rechoose"){const ci=+b.dataset.ch;cur.ch=ci;sel=Object.assign({A:false,B:false},S.paths[DATA[ci].id]||{});go("escolha");}
  if(a==="pick"){sel[b.dataset.k]=!sel[b.dataset.k];render(true);}
  if(a==="start-paths"){
    const ci=cur.ch,c=DATA[ci]; S.paths[c.id]={A:!!sel.A,B:!!sel.B}; S.chosen[c.id]=true; S.pu[c.id]=Date.now();
    setAns(c.entry.id,sel.A&&sel.B?"Fiz os dois: trabalhei fora e cuidei da casa e da família.":sel.A?"Trabalhei fora de casa.":"Me dediquei à casa e à família.");
    save(); openCh(ci);}
  if(a==="prev") step(-1);
  if(a==="skip"||a==="next") step(1);
  if(a==="rmphoto"){const id=seq(cur.ch)[cur.i].id;const ta=document.getElementById("resposta");if(ta)setAns(id,ta.value);
    const p=S.pics[b.dataset.p]; if(p){p.del=true;p.u=Date.now();idbDel(b.dataset.p).catch(()=>{});} save();render(true);}
  if(a==="reset"){confirmReset=true;render(true);setTimeout(()=>{const c=document.getElementById("resetBox");c&&c.scrollIntoView({block:"center"});},0);}
  if(a==="reset-no"){confirmReset=false;render(true);}
  if(a==="reset-yes"){const fs=S.fs;S=freshState();S.fs=fs;save();go("capa");}
});
render();
if(ghOn()) setTimeout(()=>ghSyncNow(false),3500);
if(navigator.onLine) setTimeout(()=>checkUpdate(true),5000);
</script>
